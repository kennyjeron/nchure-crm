<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCHURE CRM</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body class="bg-slate-950 text-slate-100 min-h-screen"><div id="app"></div><script>
const API='/api'; let state={token:localStorage.getItem('nchure_token'),me:null,clients:[],leads:[],projects:[],tasks:[],invoices:[],payments:[],expenses:[]};
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
async function api(path,opt={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{})},...opt});if(r.status===401){logout();throw Error('Session expired')}if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
function login(){document.getElementById('app').innerHTML=`<main class="min-h-screen grid place-items-center p-6"><form onsubmit="doLogin(event)" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl"><div class="text-3xl font-black mb-2">NCHURE</div><p class="text-slate-400 mb-8">Client & Business Management CRM</p><label class="block text-sm mb-2">Email</label><input id="email" required type="email" class="w-full mb-4 rounded-lg bg-slate-950 border border-slate-700 p-3"><label class="block text-sm mb-2">Password</label><input id="password" required type="password" class="w-full mb-6 rounded-lg bg-slate-950 border border-slate-700 p-3"><button class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 p-3 font-bold">Sign in</button><p id="err" class="text-red-400 mt-4 text-sm"></p></form></main>`}
async function doLogin(e){e.preventDefault();try{const x=await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});state.token=x.access_token;localStorage.setItem('nchure_token',state.token);await boot()}catch(x){document.getElementById('err').textContent='Invalid login or server error'}}
function logout(){localStorage.removeItem('nchure_token');state.token=null;state.me=null;login()}
async function boot(){try{state.me=await api('/auth/me');await load();render()}catch(e){logout()}}
async function load(){for(const r of ['clients','leads','projects','tasks','invoices','payments','expenses']){try{state[r]=await api('/'+r)}catch{state[r]=[]}}}
function render(){const total=a=>a.reduce((s,x)=>s+Number(x.amount||x.value||0),0);document.getElementById('app').innerHTML=`<div class="flex min-h-screen"><aside class="hidden md:flex w-64 shrink-0 bg-slate-900 border-r border-slate-800 p-5 flex-col"><div class="text-2xl font-black mb-1">NCHURE</div><div class="text-xs text-slate-500 mb-8">CRM PLATFORM</div><nav class="space-y-1">${['dashboard','clients','leads','projects','tasks','invoices','payments','expenses'].map(x=>`<button onclick="view('${x}')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800 capitalize">${x}</button>`).join('')}</nav><button onclick="logout()" class="mt-auto text-left px-3 py-2 text-red-400">Logout</button></aside><main class="flex-1 p-4 md:p-8 overflow-auto"><header class="flex items-center justify-between mb-8"><div><h1 id="title" class="text-3xl font-bold">Dashboard</h1><p class="text-slate-400">Welcome, ${esc(state.me?.name)}</p></div><button onclick="view('clients')" class="bg-indigo-600 px-4 py-2 rounded-lg">+ Add Client</button></header><section id="content"></section></main></div>`;view('dashboard')}
function view(name){document.getElementById('title').textContent=name[0].toUpperCase()+name.slice(1);const c=document.getElementById('content');if(name==='dashboard'){c.innerHTML=`<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">${[['Clients',state.clients.length],['Leads',state.leads.length],['Projects',state.projects.length],['Tasks',state.tasks.length]].map(x=>`<div class="bg-slate-900 border border-slate-800 rounded-xl p-5"><p class="text-slate-400">${x[0]}</p><b class="text-3xl">${x[1]}</b></div>`).join('')}</div><div class="grid lg:grid-cols-2 gap-6"><div class="bg-slate-900 border border-slate-800 rounded-xl p-5"><h2 class="font-bold mb-4">Recent Clients</h2>${state.clients.slice(0,8).map(x=>`<div class="py-3 border-b border-slate-800"><b>${esc(x.company||x.name)}</b><span class="text-slate-400 text-sm float-right">${esc(x.status||'Active')}</span></div>`).join('')||'<p class="text-slate-500">No clients yet</p>'}</div><div class="bg-slate-900 border border-slate-800 rounded-xl p-5"><h2 class="font-bold mb-4">Pipeline</h2><canvas id="chart"></canvas></div></div>`;new Chart(chart,{type:'doughnut',data:{labels:['Leads','Projects','Tasks'],datasets:[{data:[state.leads.length,state.projects.length,state.tasks.length]}]}});return} table(name)}
function table(name){const rows=state[name]||[];const fields={clients:['company','contact','email','phone','status'],leads:['name','company','contact','status','priority'],projects:['name','client_id','status','budget'],tasks:['title','status','priority','due_date'],invoices:['number','client_id','status','total'],payments:['invoice_id','amount','method'],expenses:['title','amount','category']}[name]||['name','status'];document.getElementById('content').innerHTML=`<div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden"><div class="p-5 flex justify-between"><h2 class="font-bold capitalize">${name}</h2><button onclick="addItem('${name}')" class="bg-indigo-600 px-4 py-2 rounded-lg">+ Add</button></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-950"><tr>${fields.map(f=>`<th class="text-left p-3 capitalize">${f.replace('_',' ')}</th>`).join('')}<th class="p-3">Action</th></tr></thead><tbody>${rows.map(x=>`<tr class="border-t border-slate-800">${fields.map(f=>`<td class="p-3">${esc(x[f])}</td>`).join('')}<td class="p-3"><button class="text-red-400" onclick="removeItem('${name}','${x.id}')">Delete</button></td></tr>`).join('')||`<tr><td colspan="${fields.length+1}" class="p-8 text-center text-slate-500">No records</td></tr>`}</tbody></table></div></div>`}
async function addItem(resource){const labels={clients:['company','contact','email','phone'],leads:['name','company','contact','status'],projects:['name','client_id','status','budget'],tasks:['title','status','priority','due_date'],invoices:['number','client_id','status','total'],payments:['invoice_id','amount','method'],expenses:['title','amount','category']}[resource]||['name'];const values={};for(const f of labels){const v=prompt('Enter '+f.replace('_',' '));if(v===null)return;values[f]=f==='budget'||f==='total'||f==='amount'?Number(v):v}try{await api('/'+resource,{method:'POST',body:JSON.stringify(values)});await load();view(resource)}catch(e){alert('Could not save record: '+e.message)}}
async function removeItem(resource,id){if(!confirm('Delete this record?'))return;try{await api('/'+resource+'/'+id,{method:'DELETE'});await load();view(resource)}catch(e){alert(e.message)}}
if(state.token)boot();else login();
</script></body></html>
